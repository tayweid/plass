name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - run: rustup default 1.97.0
      - run: npm ci
      - run: npm audit --audit-level=moderate
      # The auditor is version-pinned, so building it from source on every run
      # spends about three minutes producing the same binary. Key the cache on
      # that version and confirm what comes back still reports it; a miss
      # falls through to the locked build below.
      - name: Cache the pinned Rust auditor
        id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned Rust auditor
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Confirm the auditor is the pinned version
        run: cargo audit --version | grep -q '0\.22\.2'
      - name: Audit the Plass-owned sidecar dependency graph
        run: cargo audit --file sidecar/Cargo.lock
      - run: npm run verify:licenses
      - run: npm test
      - name: Test the Plass-owned sidecar source
        run: cargo test --locked --manifest-path sidecar/Cargo.toml
      - run: npm run test:layout
      - name: Resolve the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      # A cache hit restores the browsers but not the system libraries they
      # link against: the runner is a fresh VM every run, so the apt step has
      # to happen either way. Both forms carry a timeout because that install
      # depends on distribution mirrors, which have stalled for tens of
      # minutes; failing at ten is better than holding the deploy at thirty.
      - name: Install the Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx --no-install playwright install-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Port audit (a measurement — reported, never blocking)
        run: npm run audit
        continue-on-error: true
      # Failure reports (error-context.md, screenshots) are unreachable in a
      # log; publish them so a parity failure on this runner can be read.
      - name: Publish the browser test results when they fail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
      - run: npm run build
      - run: npm run verify:production
      # The verified site, handed to the Mac app build and to the deploy.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 1

  # Plass.app: the verified site's page inside the Claerbout shell
  # (docs/CLAERBOUT-SHELL.md), packaged on a Mac and published beside the
  # site as app/Plass-<arch>.zip without Electron's framework: the install
  # line completes it before moving it into place, and the same app as
  # app/Plass.app.zip completes itself on its first launch. Nothing is
  # committed; every deploy is the app's release. A failure here never
  # holds the site back: the deploy then republishes the app that is
  # already live.
  app:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The shell, at the tag Plass builds on (one tag, every app the same
      # day: a sibling clone needs the exact Electron). Its own checkout
      # carries Electron and the packager; Plass's node_modules are not
      # needed here.
      CLAERBOUT_TAG: v0.2.3
      CLAERBOUT_SHELL: ${{ github.workspace }}/../claerbout
      # The packager fetches Electron for each architecture itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Get the Claerbout shell
        run: |
          git clone --depth 1 --branch "$CLAERBOUT_TAG" https://github.com/tayweid/claerbout "$CLAERBOUT_SHELL"
          cd "$CLAERBOUT_SHELL" && npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - name: Package Plass.app from the verified site
        run: node app/build.mjs --web dist --arch arm64,x64 --zip published/app
      # The way a user gets it: the install line against these zips, which
      # fetches Electron's release and checks it. Then the app itself on a
      # document: it opens, typesets, saves, and a second open of the
      # document fronts the window that has it (shell 0.2.1's focus
      # request; an older shell is said and skipped).
      - name: Install it with the install line
        run: PLASS_SITE="$PWD/published" PLASS_APP="$RUNNER_TEMP/Plass.app" PLASS_SIBLINGS="" bash public/install
      - name: Smoke-test the installed app
        run: node app/smoke.mjs "$RUNNER_TEMP/Plass.app"
      # The page's download: the app completing itself on its first launch,
      # with no sibling to clone from, so Electron's release is fetched.
      - name: Smoke-test the download completing itself
        run: |
          mkdir "$RUNNER_TEMP/download"
          ditto -x -k published/app/Plass.app.zip "$RUNNER_TEMP/download"
          CLAERBOUT_SIBLINGS=/nonexistent node app/smoke.mjs "$RUNNER_TEMP/download/Plass.app"
      # The installed app updating itself (shell 0.2.0): the same app
      # packaged again under another build id into a site folder of its
      # own, and the installed one asked, through its page, to take it.
      - name: Smoke-test the app updating itself
        run: |
          CLAERBOUT_BUILD=next node app/build.mjs --web dist --arch arm64 --zip "$RUNNER_TEMP/next/app"
          node "$CLAERBOUT_SHELL/smoke.mjs" --config app/plass.json update "$RUNNER_TEMP/Plass.app" "$RUNNER_TEMP/next"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: published/app
          retention-days: 1

  # Advisory, not a gate. The sidecar build is byte-deterministic for a given
  # host — same bytes from any checkout path on the same machine — but not
  # across hosts: Cargo derives each crate's metadata hash from the full
  # rustc version string, host triple included, so a macOS rebuild and this
  # runner's rebuild differ in their TypeId constants and symbol ordering
  # even at identical sources and pinned tool versions. The checked-in
  # package therefore has to be this runner's own; a local rebuild will
  # always look like a mismatch. When one shows up, this job warns and
  # publishes the canonical rebuild to commit rather than failing the run or
  # holding the deploy: a personal editor should keep shipping while a
  # supply-chain nicety is still being settled.
  sidecar-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown --no-self-update
      - run: rustup default 1.97.0
      - run: npm ci
      # Same pinned-tool rebuild as the auditor above; the sidecar build
      # wrapper rejects any version other than the one keyed here.
      - name: Cache the pinned wasm-pack
        id: wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned wasm-pack
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm run sidecar
      - run: npm run verify:sidecar
      - name: Compare the checked sidecar package with this runner's rebuild
        id: reproducibility
        run: |
          if git diff --quiet -- sidecar/pkg sidecar/Cargo.lock; then
            echo "The checked-in sidecar package is this runner's rebuild, byte for byte." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "The checked-in sidecar package is not this runner's rebuild:"
            echo
            echo '```'
            git diff --stat -- sidecar/pkg sidecar/Cargo.lock
            echo '```'
            echo
            echo 'Download the canonical-sidecar-pkg artifact from this run and commit it.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'differs=true' >> "$GITHUB_OUTPUT"
          echo "::warning::The checked-in sidecar package is not this runner's rebuild. Download the canonical-sidecar-pkg artifact from this run and commit it."
      # The checked-in package has to be the one this runner produces. When it
      # is not, publish the canonical rebuild so it can be reviewed and
      # committed instead of leaving the diff unreachable in a log.
      - name: Publish the canonical rebuild when it differs
        if: steps.reproducibility.outputs.differs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-sidecar-pkg
          path: |
            sidecar/pkg
            sidecar/Cargo.lock
          retention-days: 7

  deploy:
    # Runs when the site verified, whether or not the app built.
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [verify, app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - if: needs.app.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app
          path: site/app
      # A deploy replaces the whole site, so an app that did not build this
      # time would otherwise vanish from under the install line.
      - name: Keep the live app when this build of it failed
        if: needs.app.result != 'success'
        run: |
          mkdir -p site/app
          kept=0
          for file in Plass-arm64.zip Plass-x64.zip Plass.app.zip latest.json; do
            if curl -fsSL -o "site/app/$file" "https://plass.tayweid.io/app/$file"; then
              kept=$((kept + 1))
            else
              rm -f "site/app/$file"
            fi
          done
          if [ "$kept" -eq 4 ]; then
            echo "::warning::Plass.app did not build; the site keeps serving the previous app."
          else
            echo "::warning::Plass.app did not build and the previous app is not all there ($kept of 3 zips); plass.tayweid.io/install fails until it does."
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
