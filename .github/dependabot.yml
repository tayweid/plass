version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /sidecar
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/New_York
    open-pull-requests-limit: 5
    # ICU and hypher are pinned with the sidecar's line-break and
    # hyphenation data so the port breaks lines as Typst does; they move on
    # purpose, with the audit, never as a routine bump.
    ignore:
      - dependency-name: 'icu_*'
      - dependency-name: 'hypher'
